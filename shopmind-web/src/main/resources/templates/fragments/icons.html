<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- 类目线性图标：按 0..9 分发，currentColor 继承文字颜色 -->
<svg th:fragment="cat-icon(index)" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
     width="26" height="26" aria-hidden="true">
    <g th:switch="${index}">
        <!-- 0 手机 -->
        <g th:case="0">
            <rect x="7" y="2.5" width="10" height="19" rx="2.5"/>
            <line x1="10.5" y1="18.5" x2="13.5" y2="18.5"/>
        </g>
        <!-- 1 耳机 -->
        <g th:case="1">
            <path d="M4 13v-1a8 8 0 0 1 16 0v1"/>
            <rect x="3" y="13" width="4" height="7" rx="1.5"/>
            <rect x="17" y="13" width="4" height="7" rx="1.5"/>
        </g>
        <!-- 2 键盘 -->
        <g th:case="2">
            <rect x="2.5" y="6" width="19" height="12" rx="2"/>
            <path d="M7 10h.01M11 10h.01M15 10h.01M17 10h.01M7 14h10"/>
        </g>
        <!-- 3 鼠标 -->
        <g th:case="3">
            <rect x="7" y="3" width="10" height="18" rx="5"/>
            <line x1="12" y1="7" x2="12" y2="10.5"/>
        </g>
        <!-- 4 显示器 -->
        <g th:case="4">
            <rect x="2.5" y="4" width="19" height="13" rx="2"/>
            <path d="M9 20h6M12 17v3"/>
        </g>
        <!-- 5 笔记本 -->
        <g th:case="5">
            <rect x="5" y="4" width="14" height="11" rx="1.5"/>
            <path d="M3 19h18l-1.2-2.5H4.2z"/>
        </g>
        <!-- 6 音箱 -->
        <g th:case="6">
            <rect x="6" y="3" width="12" height="18" rx="2"/>
            <circle cx="12" cy="15" r="3.2"/>
            <circle cx="12" cy="8" r="1.1"/>
        </g>
        <!-- 7 充电器 -->
        <g th:case="7">
            <path d="M13 2.5 5 13.5h6L11 21.5l8-11h-6z"/>
        </g>
        <!-- 8 摄像头 -->
        <g th:case="8">
            <rect x="3" y="7" width="18" height="13" rx="2.5"/>
            <circle cx="12" cy="13.5" r="3.2"/>
            <path d="M8 7l1.5-2h5L16 7"/>
        </g>
        <!-- 9 扫地机器人 -->
        <g th:case="9">
            <circle cx="12" cy="12" r="9"/>
            <circle cx="12" cy="12" r="2.2"/>
            <path d="M9 9h.01M15 9h.01"/>
        </g>
    </g>
</svg>

</body>
</html>
