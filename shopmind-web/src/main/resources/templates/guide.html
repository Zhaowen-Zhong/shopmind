<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>智能导购 · ShopMind</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/shopmind.css(v=4)}">
</head>
<body>
<header th:replace="~{fragments/layout :: storefront-header('guide')}"></header>

<main class="section" style="padding-top:34px;">
    <div class="container" style="max-width:960px;">
        <div class="section-head" style="margin-bottom:18px;">
            <div>
                <h2>ShopMind 智能导购</h2>
                <div class="sub">说出你的需求与偏好，我会先思考分析，再给出值得参考的选择</div>
            </div>
            <span class="badge">流式回答 · 结果可复现</span>
        </div>

        <div class="chat-shell">
            <div class="chat-window" id="chat">
                <div class="msg bot">
                    <div class="avatar service-avatar">
                        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"
                             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M4 13v-1a8 8 0 0 1 16 0v1"/>
                            <rect x="3" y="13" width="3.6" height="6" rx="1.8"/>
                            <rect x="17.4" y="13" width="3.6" height="6" rx="1.8"/>
                            <path d="M19 19v1a3 3 0 0 1-3 3h-3"/>
                        </svg>
                    </div>
                    <div class="bubble">你好，我是 ShopMind 智能导购。
你可以告诉我预算、使用场景或偏好，例如「适合长时间办公、手感安静的键盘」，我会从十万件商品里帮你挑。</div>
                </div>
            </div>
            <div class="chat-suggest" id="suggest">
                <span class="chat-meta" style="align-self:center;">试试：</span>
                <button class="chip" type="button">推荐一款主动降噪的头戴耳机</button>
                <button class="chip" type="button">轻薄便携、长续航的笔记本</button>
                <button class="chip" type="button">适合游戏电竞的高刷显示器</button>
            </div>
            <div class="chat-input">
                <input class="input" id="q" placeholder="描述你的购物需求，回车发送…" autocomplete="off">
                <button class="btn btn-primary" id="send">发送</button>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: storefront-footer}"></footer>

<script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('q');
    let source = null;
    let busy = false;

    function scrollBottom() { chat.scrollTop = chat.scrollHeight; }

    function humanTime(us) {
        if (us >= 100000) { return (us / 1000000).toFixed(2) + ' 秒'; }
        if (us >= 1000) { return Math.round(us / 1000) + ' 毫秒'; }
        return Math.round(us) + ' 微秒';
    }

    // 客服头像（头戴耳机）
    function serviceAvatar() {
        const a = document.createElement('div');
        a.className = 'avatar service-avatar';
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('viewBox', '0 0 24 24');
        svg.setAttribute('fill', 'none');
        svg.setAttribute('stroke', '#fff');
        svg.setAttribute('stroke-width', '1.8');
        svg.setAttribute('stroke-linecap', 'round');
        svg.setAttribute('stroke-linejoin', 'round');
        svg.innerHTML =
            '<path d="M4 13v-1a8 8 0 0 1 16 0v1"/>' +
            '<rect x="3" y="13" width="3.6" height="6" rx="1.8"/>' +
            '<rect x="17.4" y="13" width="3.6" height="6" rx="1.8"/>' +
            '<path d="M19 19v1a3 3 0 0 1-3 3h-3"/>';
        a.appendChild(svg);
        return a;
    }

    function addUserMessage(text) {
        const msg = document.createElement('div');
        msg.className = 'msg user';
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = '我';
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;
        msg.appendChild(avatar);
        msg.appendChild(bubble);
        chat.appendChild(msg);
        scrollBottom();
    }

    function addTyping() {
        const msg = document.createElement('div');
        msg.className = 'msg bot';
        msg.id = 'typing-msg';
        msg.appendChild(serviceAvatar());
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
        msg.appendChild(bubble);
        chat.appendChild(msg);
        scrollBottom();
    }

    // 智能思考面板（可折叠）
    function ensureReasoning() {
        let box = document.getElementById('reasoning-box');
        if (box) { return box; }
        const msg = document.createElement('div');
        msg.className = 'msg bot';
        msg.id = 'reasoning-msg';
        msg.appendChild(serviceAvatar());
        box = document.createElement('div');
        box.className = 'reasoning';
        box.id = 'reasoning-box';
        box.innerHTML =
            '<button type="button" class="reasoning-head">' +
            '<span class="dot"></span><span class="rt">智能思考中…</span></button>' +
            '<div class="reasoning-body"></div>';
        msg.appendChild(box);
        chat.appendChild(msg);
        box.querySelector('.reasoning-head').addEventListener('click', () => {
            if (box.classList.contains('is-done')) { box.classList.toggle('is-collapsed'); }
        });
        scrollBottom();
        return box;
    }

    function ensureAnswer() {
        let bubble = document.getElementById('answer-bubble');
        if (bubble) { return bubble; }
        const msg = document.createElement('div');
        msg.className = 'msg bot';
        msg.id = 'answer-msg';
        msg.appendChild(serviceAvatar());
        bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.id = 'answer-bubble';
        msg.appendChild(bubble);
        chat.appendChild(msg);
        scrollBottom();
        return bubble;
    }

    function removeTyping() {
        const t = document.getElementById('typing-msg');
        if (t) { t.remove(); }
    }

    function ask(text) {
        const q = (text || input.value).trim();
        if (!q || busy) { return; }
        addUserMessage(q);
        input.value = '';
        busy = true;
        addTyping();

        if (source) { source.close(); }
        source = new EventSource('/api/guide?q=' + encodeURIComponent(q));

        source.addEventListener('think', e => {
            removeTyping();
            const box = ensureReasoning();
            box.querySelector('.reasoning-body').textContent += e.data;
            scrollBottom();
        });

        source.addEventListener('chunk', e => {
            removeTyping();
            ensureAnswer().textContent += e.data;
            scrollBottom();
        });

        source.addEventListener('done', e => {
            const payload = JSON.parse(e.data);
            removeTyping();
            const box = document.getElementById('reasoning-box');
            if (box) {
                box.classList.add('is-done');
                box.querySelector('.rt').textContent = '智能思考（点击展开/收起）';
            }
            const answer = ensureAnswer();
            const note = document.createElement('div');
            note.className = 'latency-note';
            note.textContent = '本次回答用时 ' + humanTime(payload.latencyMicros);
            answer.parentElement.appendChild(note);
            source.close();
            busy = false;
            scrollBottom();
        });

        source.onerror = () => {
            removeTyping();
            if (!document.getElementById('answer-bubble')) {
                const msg = document.createElement('div');
                msg.className = 'msg bot';
                msg.appendChild(serviceAvatar());
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                bubble.textContent = '连接中断，请稍后重试。';
                msg.appendChild(bubble);
                chat.appendChild(msg);
            }
            source.close();
            busy = false;
        };
    }

    document.getElementById('send').addEventListener('click', () => ask());
    input.addEventListener('keydown', e => { if (e.key === 'Enter') { ask(); } });
    document.querySelectorAll('#suggest .chip').forEach(btn =>
        btn.addEventListener('click', () => ask(btn.textContent)));

    window.addEventListener('load', () => {
        const initial = new URLSearchParams(window.location.search).get('q');
        if (initial && initial.trim()) { ask(initial.trim()); }
    });
</script>
</body>
</html>
