<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ShopMind 知识库管理</title>
    <style>
        :root { --ink:#1b2431; --muted:#6b7787; --line:#e3e8ef; --accent:#0f6b5c; --bg:#f6f8fa; }
        * { box-sizing:border-box; }
        body { margin:0; font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif; background:var(--bg); color:var(--ink); }
        header { background:#fff; border-bottom:1px solid var(--line); padding:16px 28px; display:flex; align-items:baseline; gap:18px; }
        header h1 { font-size:18px; margin:0; }
        header nav { margin-left:auto; display:flex; gap:16px; font-size:14px; }
        header nav a { color:var(--muted); text-decoration:none; }
        header nav a.active { color:var(--accent); font-weight:600; }
        main { max-width:1120px; margin:22px auto; padding:0 20px 44px; }
        .panel { background:#fff; border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:18px; }
        h2 { font-size:15px; margin:0 0 12px; }
        .row { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
        .field { display:flex; flex-direction:column; gap:6px; }
        .field label { font-size:12px; color:var(--muted); }
        input { padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:14px; }
        #title { min-width:240px; } #desc { min-width:320px; } #category { min-width:120px; }
        button { padding:9px 16px; border:none; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
        button.danger { background:#b23b3b; padding:5px 12px; font-size:12.5px; }
        table { width:100%; border-collapse:collapse; font-size:13.5px; }
        th, td { padding:9px 12px; text-align:left; border-bottom:1px solid var(--line); }
        th { color:var(--muted); font-weight:500; font-size:12.5px; }
        .empty { padding:22px; text-align:center; color:var(--muted); font-size:13px; }
        .note { font-size:12.5px; color:var(--muted); line-height:1.7; margin-top:10px; }
    </style>
</head>
<body>
<header>
    <h1>ShopMind · Java 自研向量检索与商品知识库</h1>
    <nav>
        <a href="/">监控看板</a>
        <a href="/console">检索调试台</a>
        <a href="/kb" class="active">知识库</a>
        <a href="/guide">智能导购</a>
    </nav>
</header>
<main>
    <div class="panel">
        <h2>录入商品文档</h2>
        <div class="row">
            <div class="field"><label for="title">标题</label><input id="title" placeholder="例如：小米手机 13"></div>
            <div class="field"><label for="desc">描述</label><input id="desc" placeholder="例如：高性能旗舰手机，骁龙处理器，5000mAh 电池"></div>
            <div class="field"><label for="category">类目</label><input id="category" placeholder="例如：手机"></div>
            <div class="field"><button onclick="addDoc()">入库并建索引</button></div>
        </div>
        <p class="note" id="result">入库会同步写入三套索引与 BM25，返回端到端耗时（对应验收指标 NFR-06：500 ms 内可检索）。</p>
    </div>

    <div class="panel">
        <h2>现有文档（共 <span th:text="${total}">0</span> 条）</h2>
        <table>
            <thead><tr><th style="width:70px">ID</th><th>标题</th><th>描述</th><th style="width:110px">类目</th><th style="width:80px">操作</th></tr></thead>
            <tbody th:if="${docs.isEmpty()}">
            <tr><td colspan="5" class="empty">知识库为空，先在上面录入一条，或运行数据导入脚本。</td></tr>
            </tbody>
            <tbody th:unless="${docs.isEmpty()}">
            <tr th:each="doc : ${docs}">
                <td th:text="${doc.id()}">1</td>
                <td th:text="${doc.title()}">标题</td>
                <td th:text="${doc.description()}">描述</td>
                <td th:text="${doc.category()}">类目</td>
                <td><button class="danger" th:attr="data-id=${doc.id()}" onclick="removeDoc(this.dataset.id)">删除</button></td>
            </tr>
            </tbody>
        </table>
        <p class="note">
            分页：第 <span th:text="${page} + 1">1</span> 页，每页 <span th:text="${size}">20</span> 条。
            删除采用墓碑标记，索引侧同步移除，检索不会返回已删除文档。
        </p>
    </div>
</main>
<script>
    async function addDoc() {
        const title = document.getElementById('title').value.trim();
        const description = document.getElementById('desc').value.trim();
        const category = document.getElementById('category').value.trim();
        if (!title) { alert('标题不能为空'); return; }
        const response = await fetch('/api/docs', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({title, description, category})
        });
        const data = await response.json();
        document.getElementById('result').textContent =
            `入库成功：id=${data.id}，端到端耗时 ${data.elapsedMicros} μs。刷新页面查看列表。`;
    }

    async function removeDoc(id) {
        if (!confirm('确认删除文档 ' + id + '？')) { return; }
        const response = await fetch('/api/docs/' + id, {method: 'DELETE'});
        const data = await response.json();
        if (data.removed) { location.reload(); } else { alert('删除失败：文档不存在'); }
    }
</script>
</body>
</html>
