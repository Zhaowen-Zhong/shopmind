<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ShopMind 检索调试台</title>
    <style>
        :root { --ink:#1b2431; --muted:#6b7787; --line:#e3e8ef; --accent:#0f6b5c; --bg:#f6f8fa; }
        * { box-sizing:border-box; }
        body { margin:0; font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif; background:var(--bg); color:var(--ink); }
        header { background:#fff; border-bottom:1px solid var(--line); padding:16px 28px; display:flex; align-items:baseline; gap:18px; }
        header h1 { font-size:18px; margin:0; }
        header nav { margin-left:auto; display:flex; gap:16px; font-size:14px; }
        header nav a { color:var(--muted); text-decoration:none; }
        header nav a.active { color:var(--accent); font-weight:600; }
        main { max-width:1220px; margin:22px auto; padding:0 20px 44px; }
        .panel { background:#fff; border:1px solid var(--line); border-radius:10px; padding:16px 18px; }
        .row { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; }
        .field { display:flex; flex-direction:column; gap:6px; }
        .field label { font-size:12px; color:var(--muted); }
        input, select { padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:14px; min-width:120px; }
        #query { min-width:320px; }
        button { padding:9px 18px; border:none; border-radius:8px; background:var(--accent); color:#fff; font-size:14px; cursor:pointer; }
        button:hover { background:#0b5749; }
        .cols { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:18px; }
        .col { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px 16px; min-height:240px; }
        .col h3 { font-size:14px; margin:0 0 4px; }
        .meta { font-size:12px; color:var(--muted); margin-bottom:10px; }
        .hit { display:flex; justify-content:space-between; gap:10px; padding:7px 0; border-bottom:1px dashed var(--line); font-size:13px; }
        .hit:last-child { border-bottom:none; }
        .score { color:var(--accent); font-variant-numeric:tabular-nums; }
        .miss { color:#b23b3b; font-size:12.5px; margin-top:8px; }
        .note { margin-top:16px; font-size:12.5px; color:var(--muted); line-height:1.7; }
    </style>
</head>
<body>
<header>
    <h1>ShopMind · Java 自研向量检索与商品知识库</h1>
    <nav>
        <a href="/">监控看板</a>
        <a href="/console" class="active">检索调试台</a>
        <a href="/kb">知识库</a>
        <a href="/guide">智能导购</a>
    </nav>
</header>
<main>
    <div class="panel">
        <div class="row">
            <div class="field" style="flex:1">
                <label for="query">查询文本</label>
                <input id="query" value="降噪蓝牙耳机" placeholder="例如：降噪蓝牙耳机 / 机械键盘 青轴">
            </div>
            <div class="field">
                <label for="topk">Top-K</label>
                <input id="topk" type="number" value="10" min="1" max="50">
            </div>
            <div class="field">
                <label for="ef">efSearch（HNSW）</label>
                <input id="ef" type="number" value="100" min="1" max="500">
            </div>
            <div class="field">
                <label for="alpha">混合权重 alpha</label>
                <input id="alpha" type="range" min="0.4" max="1" step="0.1" value="0.8"
                       oninput="document.getElementById('alphaValue').textContent=this.value">
                <span style="font-size:12px;color:#6b7787">当前：<b id="alphaValue">0.8</b>（1.0 为纯向量）</span>
            </div>
            <div class="field">
                <button onclick="runSearch()">并排检索</button>
            </div>
        </div>
        <p class="note">
            三个索引在同一份向量、同一个查询上并行执行：暴力检索是精确基准，IVF 与 HNSW 是近似索引。
            对比它们的耗时与命中差异，就是本项目的核心验证场景之一。
        </p>
    </div>

    <div class="cols" id="cols">
        <div class="col" id="col-brute-force"><h3>暴力检索（精确基准）</h3><div class="meta">等待检索…</div></div>
        <div class="col" id="col-ivf"><h3>IVF 倒排聚类</h3><div class="meta">等待检索…</div></div>
        <div class="col" id="col-hnsw"><h3>HNSW 分层近邻图</h3><div class="meta">等待检索…</div></div>
    </div>
    <p class="note" id="diff"></p>
</main>
<script>
    async function runSearch() {
        const query = document.getElementById('query').value.trim();
        if (!query) { alert('请输入查询文本'); return; }
        const body = {
            query,
            topK: parseInt(document.getElementById('topk').value, 10),
            efSearch: parseInt(document.getElementById('ef').value, 10),
            alpha: parseFloat(document.getElementById('alpha').value)
        };
        const cols = document.getElementById('cols');
        cols.querySelectorAll('.col').forEach(c => c.querySelector('.meta').textContent = '检索中…');

        const response = await fetch('/api/search-all', {
            method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)
        });
        const data = await response.json();
        const baseline = new Set((data['brute-force']?.hits || []).map(h => h.id));

        render('col-brute-force', data['brute-force'], baseline, true);
        render('col-ivf', data['ivf'], baseline, false);
        render('col-hnsw', data['hnsw'], baseline, false);
    }

    function render(colId, result, baseline, isBaseline) {
        const col = document.getElementById(colId);
        if (!result) { col.innerHTML = '<h3>无结果</h3>'; return; }
        const head = col.querySelector('h3').outerHTML;
        let html = head + `<div class="meta">耗时 ${result.latencyMicros} μs ・ 命中 ${result.hits.length} 条</div>`;
        let miss = 0;
        for (const hit of result.hits) {
            if (!isBaseline && !baseline.has(hit.id)) { miss++; }
            html += `<div class="hit"><span>${escapeHtml(hit.title || ('文档 ' + hit.id))}</span>
                     <span class="score">${hit.score.toFixed(3)}</span></div>`;
        }
        if (!isBaseline) {
            html += `<div class="miss">与暴力基准相比未命中 ${miss} 条</div>`;
        }
        col.innerHTML = html;
    }

    function escapeHtml(text) {
        return String(text).replace(/[&<>"']/g, s => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[s]));
    }
</script>
</body>
</html>
