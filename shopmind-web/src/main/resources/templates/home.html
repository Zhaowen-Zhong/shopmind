<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ShopMind · 用自然语言找到对的商品</title>
    <link rel="stylesheet" th:href="@{/css/shopmind.css(v=2)}">
</head>
<body>
<header th:replace="~{fragments/layout :: storefront-header('home')}"></header>

<!-- 品牌主视觉 -->
<section class="hero">
    <div class="container hero-inner">
        <span class="eyebrow">纯 Java 自研向量检索 · 商品知识库智能导购</span>
        <h1>用一句<span class="hl">自然语言</span>，<br>从十万件商品里找到对的选择</h1>
        <p class="lead">
            ShopMind 融合 HNSW 向量语义检索与 BM25 关键词检索，理解你的真实需求，
            毫秒级给出可解释的推荐，而不只是关键字的生硬匹配。
        </p>
        <form class="hero-search" th:action="@{/products}" method="get">
            <input class="input" type="text" name="q" placeholder="例如：适合长时间办公的静音键盘" autofocus>
            <button class="btn btn-primary" type="submit">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 4.6L18.5 9l-4.6 1.9L12 15.5l-1.9-4.6L5.5 9l4.6-1.4z"/><path d="M18.5 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg>
                智能搜索
            </button>
        </form>
        <div class="hero-popular">
            <span class="t">热门：</span>
            <a class="chip" th:href="@{/products(q='主动降噪蓝牙耳机')}">主动降噪蓝牙耳机</a>
            <a class="chip" th:href="@{/products(q='轻薄长续航笔记本')}">轻薄长续航笔记本</a>
            <a class="chip" th:href="@{/products(q='人体工学静音鼠标')}">人体工学静音鼠标</a>
            <a class="chip" th:href="@{/products(q='4K 护眼显示器')}">4K 护眼显示器</a>
        </div>

        <div class="stat-strip">
            <div class="item" data-tip="知识库里可被检索的商品总量，覆盖数码、办公与智能家居">
                <div class="num" th:text="${totalDisplay}">100,000+</div><div class="lbl">在售商品（件）</div>
            </div>
            <div class="item" data-tip="平台覆盖十大一级商品类目，每个类目下还有丰富的细分品类">
                <div class="num" th:text="${categories.size()}">10</div><div class="lbl">一级类目</div>
            </div>
            <div class="item" data-tip="每件商品都被表示为 384 个数字特征，系统据此理解语义而非只匹配字面">
                <div class="num" th:text="${dimension} + '维'">384维</div><div class="lbl">语义向量</div>
            </div>
            <div class="item" data-tip="在十万级商品上，100 次检索中约 99 次在 3.45 毫秒内返回结果">
                <div class="num" th:text="${p99} + 'ms'">3.45ms</div><div class="lbl">检索 P99 延迟</div>
            </div>
        </div>
    </div>
</section>

<!-- 分类入口：5 列 × 2 排 -->
<section class="section">
    <div class="container">
        <div class="section-head">
            <div>
                <h2>按类目挑选</h2>
                <div class="sub">覆盖数码、办公与智能家居的十大商品类目</div>
            </div>
            <a class="btn btn-ghost btn-sm" th:href="@{/products}">查看全部</a>
        </div>
        <div class="cat-grid">
            <th:block th:each="entry, it : ${categoryCounts}">
                <th:block th:replace="~{fragments/components :: category-card(${entry.key}, ${entry.value}, ${it.index})}"></th:block>
            </th:block>
        </div>
    </div>
</section>

<!-- 精选商品 -->
<section class="section" style="padding-top:0;">
    <div class="container">
        <div class="section-head">
            <div>
                <h2>为你精选</h2>
                <div class="sub">点击“问导购”可直接就该商品向智能助手追问</div>
            </div>
            <a class="btn btn-ghost btn-sm" th:href="@{/products}">更多商品</a>
        </div>
        <div class="product-grid">
            <th:block th:each="v : ${featured}">
                <th:block th:replace="~{fragments/components :: product-card(${v})}"></th:block>
            </th:block>
        </div>
    </div>
</section>

<footer th:replace="~{fragments/layout :: storefront-footer}"></footer>

<!-- 悬浮助手：页脚出现时自动避让 -->
<a class="float-assistant" th:href="@{/guide}" aria-label="智能导购">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9.6 9.6 0 0 1-4.9-1.3L3 20l1.4-4A8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"/><path d="M9 11h.01M15 11h.01M9.5 14.5a3.5 3.5 0 0 0 5 0"/></svg>
</a>

<script>
    // 悬浮助手与页脚碰撞避让
    const floatBtn = document.querySelector('.float-assistant');
    const footer = document.querySelector('.site-footer');
    const observer = new IntersectionObserver(entries => {
        entries.forEach(e => floatBtn.classList.toggle('is-hidden', e.isIntersecting));
    }, {threshold: 0.05});
    observer.observe(footer);
</script>
</body>
</html>
