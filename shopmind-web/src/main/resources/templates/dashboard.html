<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ShopMind 监控看板</title>
    <style>
        :root { --ink:#1b2431; --muted:#6b7787; --line:#e3e8ef; --accent:#0f6b5c; --bg:#f6f8fa; }
        * { box-sizing: border-box; }
        body { margin:0; font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif; background:var(--bg); color:var(--ink); }
        header { background:#fff; border-bottom:1px solid var(--line); padding:16px 28px; display:flex; align-items:baseline; gap:18px; }
        header h1 { font-size:18px; margin:0; letter-spacing:.5px; }
        header nav { margin-left:auto; display:flex; gap:16px; font-size:14px; }
        header nav a { color:var(--muted); text-decoration:none; }
        header nav a.active { color:var(--accent); font-weight:600; }
        main { max-width:1120px; margin:24px auto; padding:0 20px 40px; }
        .cards { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
        .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:16px 18px; }
        .card .label { font-size:12px; color:var(--muted); }
        .card .value { font-size:26px; font-weight:600; margin-top:6px; font-variant-numeric:tabular-nums; }
        .card .unit { font-size:12px; color:var(--muted); margin-left:4px; }
        section { margin-top:26px; }
        h2 { font-size:15px; margin:0 0 12px; color:var(--ink); }
        table { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); border-radius:10px; overflow:hidden; font-size:13.5px; }
        th, td { padding:10px 14px; text-align:left; border-bottom:1px solid var(--line); }
        th { background:#fbfcfd; color:var(--muted); font-weight:500; font-size:12.5px; }
        tr:last-child td { border-bottom:none; }
        .tag { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; background:#eef6f4; color:var(--accent); }
        .note { margin-top:18px; font-size:12.5px; color:var(--muted); line-height:1.7; }
        .bar { height:8px; background:#eef1f5; border-radius:6px; overflow:hidden; }
        .bar span { display:block; height:8px; background:var(--accent); }
    </style>
</head>
<body>
<header>
    <h1>ShopMind · Java 自研向量检索与商品知识库</h1>
    <nav>
        <a href="/" class="active">监控看板</a>
        <a href="/console">检索调试台</a>
        <a href="/kb">知识库</a>
        <a href="/guide">智能导购</a>
    </nav>
</header>
<main>
    <div class="cards">
        <div class="card">
            <div class="label">知识库文档</div>
            <div class="value" th:text="${stats['documents']}">0</div>
        </div>
        <div class="card">
            <div class="label">HNSW 索引向量</div>
            <div class="value" th:text="${stats['hnsw']['size']}">0</div>
        </div>
        <div class="card">
            <div class="label">网关活跃长连接</div>
            <div class="value" th:text="${stats['gateway']['activeConnections']}">0</div>
        </div>
        <div class="card">
            <div class="label">累计检索请求</div>
            <div class="value" th:text="${stats['gateway']['totalSearches']}">0</div>
        </div>
    </div>

    <section>
        <h2>索引状态</h2>
        <table>
            <thead>
            <tr><th>索引</th><th>有效向量</th><th>维度</th><th>层级/簇数</th><th>平均邻居</th><th>估算内存</th></tr>
            </thead>
            <tbody>
            <tr th:each="entry : ${stats}" th:if="${entry.key != 'documents' and entry.key != 'gateway' and entry.key != 'bm25'}">
                <td><span class="tag" th:text="${entry.key}">hnsw</span></td>
                <td th:text="${entry.value['size']}">0</td>
                <td th:text="${entry.value['dimension']}">128</td>
                <td th:text="${entry.value['maxLevel']}">0</td>
                <td th:text="${entry.value['avgDegree']}">0</td>
                <td th:text="${entry.value['memoryBytes']} + ' B'">0 B</td>
            </tr>
            <tr>
                <td><span class="tag">bm25</span></td>
                <td th:text="${stats['bm25']['size']}">0</td>
                <td th:text="'词表 ' + ${stats['bm25']['vocabulary']}">-</td>
                <td>-</td>
                <td>-</td>
                <td>-</td>
            </tr>
            </tbody>
        </table>
    </section>

    <section>
        <h2>自研网关卡</h2>
        <table>
            <thead>
            <tr><th>监听端口</th><th>累计连接</th><th>限流拒绝</th><th>鉴权失败</th></tr>
            </thead>
            <tbody>
            <tr>
                <td th:text="${stats['gateway']['port']}">9099</td>
                <td th:text="${stats['gateway']['totalConnections']}">0</td>
                <td th:text="${stats['gateway']['rejectedByLimit']}">0</td>
                <td th:text="${stats['gateway']['unauthorized']}">0</td>
            </tr>
            </tbody>
        </table>
        <p class="note">
            说明：网关使用自研二进制协议（magic + version + cmd + seq + length + body），HTTP 端口只服务页面与管理接口。<br>
            数据来源为应用内实时计数，与《系统验证报告》中的压测口径一致。
        </p>
    </section>
</main>
</body>
</html>
