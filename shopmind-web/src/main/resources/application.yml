server:
  port: 8080
spring:
  application:
    name: shopmind
  thymeleaf:
    cache: false
  mvc:
    format:
      date: iso
shopmind:
  gateway:
    port: 9099
    token: shopmind-demo-token
    limit-capacity: 50
    limit-refill: 50
  data:
    path: ./data/shopmind
  embedding:
    dimension: 384
logging:
  level:
    com.shopmind: info
    io.netty: warn
